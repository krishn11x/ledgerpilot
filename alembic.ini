[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The URL is read from LP_DATABASE_URL at runtime by migrations/env.py.
# Left blank here so credentials never land in a committed file.
sqlalchemy.url =

[post_write_hooks]
# ``exec`` rather than ``console_scripts``: ruff ships as a native binary, so it
# has no Python entrypoint for Alembic to import and the console_scripts hook
# fails with "Could not find entrypoint console_scripts.ruff".
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
